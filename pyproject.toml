[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-advocacy"
version = "0.1.0"
description = "Data advocacy tools and analysis"
requires-python = ">=3.12"
license = "MIT"

[project.optional-dependencies]
# Strumenti in obblighi/ (il runtime registro/bozza/portal_scan resta stdlib).
obblighi = ["jsonschema", "pyyaml", "duckdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=line"
markers = [
    "contract: contratto pubblico (CLI/output/record)",
    "policy: regola non ovvia o comportamento cross-component",
    "pure_unit: logica pura piccola",
    "smoke: flusso end-to-end minimo",
]

# Lint deterministico, auto-contenuto (allineato allo standard del Lab).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
