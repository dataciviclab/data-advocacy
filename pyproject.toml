[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-data-advocacy"
dynamic = ["version"]
description = "Strumenti di advocacy sui dati: compliance scoring, FOIA engine, segnalazioni, tracciamento pressione su fonti pubbliche."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{ name = "DataCivicLab" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.14",
    "mypy>=2.0.0",
]

[project.urls]
Repository = "https://github.com/dataciviclab/data-advocacy"

[tool.setuptools.packages.find]
include = ["data_advocacy", "data_advocacy.*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "data_advocacy.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=line --cov=data_advocacy --timeout=30"
markers = [
    "contract: interfaccia pubblica, artifact format, contratto API",
    "policy: regola Lab non ovvia o comportamento cross-component",
    "regression: bug fix documentato in issue/PR",
    "pure_unit: logica pura non banale, zero side effect",
]
