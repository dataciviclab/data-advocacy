name: Sync FOIA Board
on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC tutti i giorni
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Sincronizza FOIA registry → Issues + Board
        run: python scripts/sync_foia_issues.py
        env:
          GH_TOKEN: ${{ github.token }}
