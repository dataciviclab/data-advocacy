name: CI
on:
  pull_request:
    paths-ignore: ["data/**", "skills/**", "README.md"]
  push:
    branches: [main]
    paths-ignore: ["data/**", "skills/**", "README.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest jsonschema ruff pyyaml
      - run: ruff check .
      - run: python -m pytest tests/ -q
      - run: python foia.py --report
      - run: python foia.py --lista
      - name: Registro aggiornato?
        run: |
          python registro.py build
          git diff --exit-code REGISTRO.md
