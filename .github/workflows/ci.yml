name: CI
on:
  pull_request:
    paths-ignore: ["data/**", "skills/**", "README.md"]
  push:
    branches: [main]
    paths-ignore: ["data/**", "skills/**", "README.md"]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python foia.py --status
      - run: python foia.py --lista
