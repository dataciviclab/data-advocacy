name: Daily Advocacy Check
on:
  schedule:
    - cron: "30 6 * * *"  # 06:30 UTC tutti i giorni
  workflow_dispatch:

jobs:
  check-escalation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verifica scadenze FOIA
        run: python scripts/check_deadlines.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
