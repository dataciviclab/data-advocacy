name: Obblighi Drift

# Check con RETE, fuori dal gate PR: un rename IPA o un testo di legge modificato
# non devono rendere rossa una PR. Se falliscono, aprono una issue di manutenzione.

on:
  schedule:
    - cron: "0 6 * * 1"   # lunedì 06:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema duckdb

      - name: Nomi IPA (clean pubblico su GCS)
        id: names
        continue-on-error: true
        run: python obblighi/build_mapping.py --check-names

      - name: Ancore normative (legal-graph)
        id: locator
        continue-on-error: true
        run: |
          pip install "git+https://github.com/dataciviclab/legal-graph.git"
          python obblighi/validate.py --with-locator

      - name: Apri issue di manutenzione se qualcosa è fallito
        if: steps.names.outcome == 'failure' || steps.locator.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "manutenzione: obblighi — drift rilevato";
            const names = "${{ steps.names.outcome }}";
            const locator = "${{ steps.locator.outcome }}";
            const body = [
              "Il check schedulato degli obblighi informativi è fallito.",
              "",
              `- **Nomi IPA** (\`--check-names\`): ${names}`,
              `- **Ancore normative** (\`--with-locator\`): ${locator}`,
              "",
              "Cosa fare:",
              "1. `python obblighi/build_mapping.py --check-names` in locale",
              "2. `python obblighi/validate.py --with-locator`",
              "3. Se è un rename/accorpamento IPA o un testo cambiato, rigenera/aggiorna e apri una PR.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            if (!open.some((i) => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
